<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Conectando con Larry...</title>
<meta http-equiv="refresh" content="1;url=https://wa.link/wnllkj">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A;
    --text: #F8F6F1;
    --text-soft: #8A8580;
    --accent: #B8460E;
    --whatsapp: #25D366;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 30%, rgba(184, 70, 14, 0.08) 0%, transparent 60%), var(--bg);
  }

  .wrap {
    max-width: 460px;
    width: 100%;
    text-align: center;
  }

  .logo {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-soft);
    margin-bottom: 56px;
    opacity: 0;
    animation: fade-in 0.6s ease forwards;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(28px, 6vw, 38px);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-bottom: 16px;
    font-variation-settings: "opsz" 144;
    opacity: 0;
    animation: fade-in 0.6s 0.2s ease forwards;
  }

  .accent {
    color: var(--accent);
  }

  .sub {
    font-size: 15px;
    color: var(--text-soft);
    line-height: 1.6;
    margin-bottom: 40px;
    opacity: 0;
    animation: fade-in 0.6s 0.4s ease forwards;
  }

  .pulse {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    background: rgba(37, 211, 102, 0.08);
    border: 1px solid rgba(37, 211, 102, 0.3);
    border-radius: 100px;
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
    opacity: 0;
    animation: fade-in 0.6s 0.6s ease forwards;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: var(--whatsapp);
    border-radius: 50%;
    animation: pulse 1.4s ease-in-out infinite;
  }

  .fallback {
    margin-top: 48px;
    opacity: 0;
    animation: fade-in 0.6s 2s ease forwards;
  }

  .fallback p {
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 12px;
  }

  .fallback a {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    border-bottom: 1px solid currentColor;
    padding-bottom: 2px;
  }

  .fallback a:hover {
    color: var(--text);
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
</style>
</head>
<body>

<main class="wrap">
  <div class="logo">LARRY</div>

  <h1>Te paso a <span class="accent">WhatsApp</span> en un segundo</h1>

  <p class="sub">Estamos abriendo el chat con un mensaje pre-cargado.<br>Solo tenés que pulsar "Enviar".</p>

  <div class="pulse">
    <span class="dot"></span>
    Redirigiendo a WhatsApp
  </div>

  <div class="fallback">
    <p>¿No se abrió automáticamente?</p>
    <a href="https://wa.link/wnllkj">Pulsa aquí para abrir WhatsApp</a>
  </div>
</main>

<script>
  // Redirección JS como respaldo del meta refresh
  setTimeout(function() {
    window.location.href = "https://wa.link/wnllkj";
  }, 1200);
</script>

</body>
</html>
