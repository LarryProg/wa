<title>Chateá con Larry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A;
    --text: #F8F6F1;
    --text-soft: #8A8580;
    --accent: #B8460E;
    --whatsapp: #25D366;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 30%, rgba(184, 70, 14, 0.08) 0%, transparent 60%), var(--bg);
  }

  .wrap {
    max-width: 460px;
    width: 100%;
    text-align: center;
  }

  .logo {
    display: block;
    width: clamp(160px, 45vw, 240px);
    height: auto;
    margin: 0 auto 56px;
    /* logo blanco con fondo transparente: se muestra tal cual */
    opacity: 0;
    animation: fade-in 0.6s ease forwards;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(28px, 6vw, 38px);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-bottom: 16px;
    font-variation-settings: "opsz" 144;
    opacity: 0;
    animation: fade-in 0.6s 0.2s ease forwards;
  }

  .accent {
    color: var(--accent);
  }

  .wa {
    color: var(--whatsapp);
  }

  .sub {
    font-size: 15px;
    color: var(--text-soft);
    line-height: 1.6;
    margin-bottom: 40px;
    opacity: 0;
    animation: fade-in 0.6s 0.4s ease forwards;
  }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 32px;
    background: linear-gradient(135deg, #2EE874 0%, #25D366 50%, #1FB855 100%);
    color: #0A0A0A;
    border-radius: 100px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.15) inset,
      0 1px 0 rgba(255, 255, 255, 0.45) inset,
      0 4px 20px rgba(37, 211, 102, 0.45),
      0 0 60px rgba(37, 211, 102, 0.35);
    transition: transform 0.2s ease, box-shadow 0.3s ease, filter 0.3s ease;
    opacity: 0;
    animation: fade-in 0.6s 0.6s ease forwards, glow-pulse 2.4s 1.2s ease-in-out infinite;
  }

  .btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.2) inset,
      0 1px 0 rgba(255, 255, 255, 0.55) inset,
      0 8px 28px rgba(37, 211, 102, 0.6),
      0 0 80px rgba(37, 211, 102, 0.5);
  }

  .btn:active {
    transform: translateY(0);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.15) inset,
      0 4px 16px rgba(37, 211, 102, 0.4),
      0 0 40px rgba(37, 211, 102, 0.3);
  }

  .btn svg {
    width: 22px;
    height: 22px;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes glow-pulse {
    0%, 100% {
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.15) inset,
        0 1px 0 rgba(255, 255, 255, 0.45) inset,
        0 4px 20px rgba(37, 211, 102, 0.45),
        0 0 60px rgba(37, 211, 102, 0.35);
    }
    50% {
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.2) inset,
        0 1px 0 rgba(255, 255, 255, 0.5) inset,
        0 6px 24px rgba(37, 211, 102, 0.55),
        0 0 90px rgba(37, 211, 102, 0.55);
    }
  }
</style>
</head>
